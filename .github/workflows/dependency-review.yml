# Checks the dependencies a pull request adds or changes, before they reach
# main: known vulnerabilities and licenses that don't fit an MIT project.
name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          # The default checks only runtime dependencies. Development tools
          # run on our machines and in CI, with access to the code, so they
          # are checked too.
          fail-on-scopes: runtime, development
          # Permissive licenses, plus the weak-copyleft ones some dev tools use
          # (MPL-2.0: lightningcss, LGPL-3.0: SonarJS, EPL-2.0: a Prisma Studio
          # dependency). None of them is shipped modified or linked into our code.
          # BSD-2-Clause-Views (uri-js, under ESLint) is BSD-2-Clause plus one
          # sentence saying the authors' views aren't official policy: no new
          # obligation.
          allow-licenses: >-
            MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-2-Clause-Views, BSD-3-Clause, 0BSD,
            BlueOak-1.0.0, CC0-1.0, CC-BY-4.0, Python-2.0, Unlicense, MPL-2.0,
            LGPL-3.0-only, EPL-2.0
          show-openssf-scorecard: true
