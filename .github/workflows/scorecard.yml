# OpenSSF Scorecard grades the repository's security practices (pinned
# dependencies, branch protection, token permissions, code review...).
# Results go to the Security tab and to the badge in the README.
#
# Scorecard only accepts published results from a workflow that follows its
# rules: no top-level env or write permissions, and only approved actions in
# this job. Keep this file minimal.
name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload the results to code scanning
      id-token: write # prove to the Scorecard API that this workflow produced the results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not v2.6.0: the image it runs can't be pulled (its linux/amd64 manifest
      # is missing from GHCR: 404), so the job failed before it started.
      # dependabot.yml skips that version.
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
