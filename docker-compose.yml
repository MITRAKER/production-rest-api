# `docker compose up -d db` starts only Postgres for local development.
# `docker compose up --build` starts Postgres, runs migrations, then starts the API.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: api
      POSTGRES_PASSWORD: api
      POSTGRES_DB: api_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U api -d api_dev']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://api:api@db:5432/api_dev
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://api:api@db:5432/api_dev
      # Local demo only. In production this comes from a secrets manager.
      JWT_ACCESS_SECRET: compose-demo-secret-compose-demo-secret-1234
    ports:
      - '3000:3000'

volumes:
  pgdata:
